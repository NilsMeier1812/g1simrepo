# ══════════════════════════════════════════════════════════════════════
# G1Pilot Universal Docker-Compose
# Sim:  G1_SIM_MODE=true docker compose --profile sim up
# Real: G1_SIM_MODE=false docker compose --profile real up
# ══════════════════════════════════════════════════════════════════════


# ── Gemeinsame Basis-Konfiguration für G1Pilot Container ────────────
x-g1pilot-base: &g1pilot-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: g1pilot:v1.1.0
  network_mode: host         # KRITISCH: DDS braucht Host-Netzwerk!
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - .:/ros2_ws/src/g1pilot:rw   # Live-Code in den colcon-Workspace mounten
  stdin_open: true
  tty: true
  restart: "no"          # interaktiv: bei Fehler NICHT endlos im Hintergrund neustarten

services:

  # ══════════════════════════════════════════════════════════════════
  # SIMULATION SERVICES (nur bei --profile sim)
  # ══════════════════════════════════════════════════════════════════

  mujoco-sim:
    # ── MuJoCo G1 Simulator ────────────────────────────────────────
    profiles: ["sim"]
    build:
      context: ..
      dockerfile: g1pilot/docker/Dockerfile.mujoco
    image: g1pilot-mujoco:v1.0
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glfw
      # weld = Arm-only (Basis fix), off = Loco-Modus (Basis frei). Siehe run_sim_loco.sh.
      - HOLD_BASE_MODE=${HOLD_BASE_MODE:-weld}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../unitree_mujoco:/unitree_mujoco:ro   # Mountet dein lokales Repo!
    command: >
      bash -c "cd /unitree_mujoco/simulate_python &&
               python3 unitree_mujoco.py"
    restart: "no"          # bei X11-/GLFW-Fehler nicht endlos neustarten
    tty: true

  g1pilot-sim:
    # ── G1Pilot im Simulations-Modus ───────────────────────────────
    profiles: ["sim"]
    <<: *g1pilot-base
    # Schlankes Sim-Image: KEIN livox/MOLA (die braucht nur der echte Roboter
    # und ihr Build schlägt sonst fehl). Nur rviz2/pin/tf2/cyclonedds/sdk.
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: g1pilot-sim:v1.1.0
    environment:
      - DISPLAY=${DISPLAY}
      - G1_SIM_MODE=true          # ← Aktiviert Simulation in Python-Code
      # ROS-Graph-Domain MUSS sich von der Unitree-DDS-Domain (1 im Sim)
      # unterscheiden, sonst kollidieren rmw_cyclonedds und unitree_sdk2py
      # im selben Prozess (robot_state crasht: "create domain error").
      - ROS_DOMAIN_ID=0
      # KRITISCH: ROS auf CycloneDDS zwingen. Sonst nimmt Humble den Default
      # (FastDDS), der die cyclonedds.xml IGNORIERT und SPDP-Multicast auf ALLEN
      # Interfaces (inkl. WLAN) macht -> flutet wlanX, crasht z.B. iwlwifi-Firmware.
      # Mit CycloneDDS greift /etc/cyclonedds.xml (nur lo, Multicast aus, Peer 127.0.0.1).
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    command: >
      bash -c "cd /ros2_ws &&
               source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               colcon build --packages-select g1pilot --symlink-install &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch g1pilot bringup_sim.launch.py"
    depends_on:
      - mujoco-sim

  # ══════════════════════════════════════════════════════════════════
  # REAL HARDWARE SERVICES (nur bei --profile real)
  # ══════════════════════════════════════════════════════════════════

  g1pilot-real:
    # ── G1Pilot mit echtem G1 Roboter ──────────────────────────────
    profiles: ["real"]
    <<: *g1pilot-base
    environment:
      - DISPLAY=${DISPLAY}
      - G1_SIM_MODE=false         # ← Echter Roboter
      - ROS_DOMAIN_ID=0
      - ROBOT_INTERFACE=${ROBOT_INTERFACE:-eth0}
    command: >
      bash -c "cd /ros2_ws &&
               source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               colcon build --packages-select g1pilot --symlink-install &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch g1pilot bringup_launcher.launch.py
                 use_robot:=true
                 interface:=${ROBOT_INTERFACE:-eth0}"